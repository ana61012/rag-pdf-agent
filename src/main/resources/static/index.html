<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ask my PDF</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg:#e6dcfb; --bg2:#d9ccf7; --panel:#c9b8f0; --panel-soft:#ece4fc;
            --edge:#6a52b5; --edge-dark:#4a3a8c; --ink:#3b2d78;
            --pink:#f58ad0; --pink-soft:#fbc4e8; --blue:#6db3f2; --yellow:#f7cf5a; --green:#7bcf7f;
            --shadow:0 4px 0 var(--edge-dark);
        }
        *{box-sizing:border-box}
        html,body{height:100%;margin:0}
        body{
            font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;color:var(--ink);
            background:
                    radial-gradient(circle at 20% 10%,#f3ecff 0,transparent 40%),
                    radial-gradient(circle at 90% 90%,#cdbdf3 0,transparent 45%),
                    var(--bg);
            padding:20px 16px 28px;
        }
        .wrap{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:290px 1fr;gap:18px;align-items:start}
        @media(max-width:780px){.wrap{grid-template-columns:1fr}}
        :focus-visible{outline:3px solid var(--pink);outline-offset:2px}

        /* chunky panel */
        .panel{background:var(--panel-soft);border:3px solid var(--edge);border-radius:18px;box-shadow:var(--shadow);position:relative}
        .hud{background:linear-gradient(#7a62c4,#6a52b5);color:#fff;border-color:var(--edge-dark);padding:10px 14px;display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.5px}
        .hud .val{margin-left:auto;background:#5a44a3;border-radius:12px;padding:2px 14px;min-width:84px;text-align:center;box-shadow:inset 0 2px 0 rgba(0,0,0,.25)}
        .hud svg{width:26px;height:26px;flex:none}
        .side{display:grid;gap:14px}
        .xp{padding:10px 14px;display:flex;gap:10px;align-items:center;background:#6a52b5;border-color:var(--edge-dark);color:#fff;font-weight:700}
        .bar{flex:1;height:16px;border-radius:10px;background:#4a3a8c;overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.3)}
        .bar>i{display:block;height:100%;width:0;background:linear-gradient(#ffb3e3,var(--pink));border-radius:10px;transition:width .5s}
        .bar.busy>i{width:40%;animation:slide 1s infinite alternate ease-in-out}
        @keyframes slide{to{margin-left:60%}}

        /* upload */
        .upload{padding:16px;text-align:center}
        .upload h2{margin:0 0 10px;font-size:1.1rem}
        .drop{display:block;border:3px dashed #9d86dd;border-radius:14px;padding:18px 10px;background:#f6f1ff;cursor:pointer;transition:.15s}
        .drop:hover,.drop.over{background:#fff;border-color:var(--pink);transform:translateY(-2px)}
        .drop input{position:absolute;opacity:0;width:0;height:0}
        .drop b{display:block;font-size:1rem}
        .drop small{opacity:.75}
        .docs{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px;text-align:left;font-size:.9rem}
        .docs li{background:#fff;border:2px solid #c9b8f0;border-radius:10px;padding:5px 10px;display:flex;gap:8px;align-items:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .docs li::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--blue);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15);flex:none}

        /* tetris deco */
        .deco{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:6px 0}
        .piece{display:grid;gap:2px}
        .piece i{width:15px;height:15px;border-radius:4px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.45)}

        /* chat window */
        .win{display:flex;flex-direction:column;height:min(78vh,720px);min-height:460px;overflow:hidden}
        .titlebar{background:linear-gradient(#7a62c4,#6a52b5);color:#fff;padding:9px 14px;display:flex;align-items:center;gap:7px;font-weight:600}
        .titlebar .dot{width:12px;height:12px;border-radius:50%;background:#fff;opacity:.9}
        .titlebar span.t{margin-left:8px}
        .titlebar .x{margin-left:auto;opacity:.8;font-weight:700}
        .log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:
                linear-gradient(#f3edff,#e9defc)}
        .empty{margin:auto;text-align:center;max-width:300px;opacity:.85}
        .msg{max-width:82%;padding:10px 14px;border-radius:16px;border:3px solid var(--edge);box-shadow:0 3px 0 var(--edge-dark);line-height:1.4;white-space:pre-wrap;word-wrap:break-word;animation:pop .2s ease-out}
        .msg.USER{align-self:flex-end;background:var(--pink-soft);border-bottom-right-radius:4px}
        .msg.SYSTEM{align-self:flex-start;background:#fff;border-bottom-left-radius:4px}
        .msg time{display:block;font-size:.7rem;opacity:.6;margin-top:4px}
        @keyframes pop{from{transform:scale(.94);opacity:0}}
        .typing span{display:inline-block;width:8px;height:8px;margin:0 2px;border-radius:50%;background:var(--edge);animation:bob .9s infinite}
        .typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
        @keyframes bob{50%{transform:translateY(-5px)}}

        form{display:flex;gap:10px;padding:12px;background:var(--panel);border-top:3px solid var(--edge)}
        input[type=text]{flex:1;font:inherit;color:var(--ink);padding:10px 14px;border:3px solid var(--edge);border-radius:14px;background:#fff;min-width:0}
        button.go{font:inherit;font-weight:700;color:#fff;background:linear-gradient(#ff9fdc,var(--pink));border:3px solid #b8499a;border-radius:14px;padding:0 20px;box-shadow:0 4px 0 #b8499a;cursor:pointer}
        button.go:active{transform:translateY(3px);box-shadow:0 1px 0 #b8499a}
        button.go:disabled{opacity:.55;cursor:wait}

        /* toast banner */
        .toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-140%);transition:transform .35s cubic-bezier(.3,1.4,.5,1);z-index:9;
            background:var(--pink-soft);border:3px solid var(--edge);border-radius:14px;box-shadow:var(--shadow);padding:10px 20px;font-weight:700;display:flex;gap:10px;align-items:center}
        .toast.show{transform:translate(-50%,0)}
        .toast.err{background:#ffd3d3;border-color:#b24a4a}
        @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
    </style>
</head>
<body>
<div class="toast" id="toast" role="status"></div>
<div class="wrap">
    <aside class="side">
        <div class="panel hud"><svg viewBox="0 0 24 24"><path d="M3 18l-1-11 5 4 5-8 5 8 5-4-1 11z" fill="#f7cf5a" stroke="#c9972a" stroke-width="1.5" stroke-linejoin="round"/></svg>LEVEL<span class="val" id="level">1</span></div>
        <div class="panel hud"><svg viewBox="0 0 24 24"><path d="M12 2l3 7 7 .6-5.4 4.7 1.7 7.2L12 17.8 5.7 21.5l1.7-7.2L2 9.6 9 9z" fill="#f7cf5a" stroke="#c9972a" stroke-width="1.5" stroke-linejoin="round"/></svg>SCORE<span class="val" id="score">000000</span></div>
        <div class="panel xp">XP<div class="bar" id="bar"><i id="xp"></i></div></div>

        <div class="panel upload">
            <h2>Add a PDF</h2>
            <label class="drop" id="drop">
                <input type="file" id="file" accept="application/pdf">
                <b>Drop it here or tap to pick</b>
                <small>PDF only, up to 5 MB</small>
            </label>
            <ul class="docs" id="docs"></ul>
        </div>
        <div class="deco" id="deco" aria-hidden="true"></div>
    </aside>

    <main class="panel win">
        <div class="titlebar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="t">Ask my PDF</span><span class="x">✕</span></div>
        <div class="log" id="log" aria-live="polite"></div>
        <form id="form">
            <input type="text" id="q" placeholder="Ask something about your document…" autocomplete="off" aria-label="Your question">
            <button class="go" id="send">Send</button>
        </form>
    </main>
</div>

<script>
    const API = '/api/ai';           // same origin as Spring Boot (port 8888)
    const $ = id => document.getElementById(id);
    const log = $('log'), q = $('q'), send = $('send');

    // --- tetromino decoration
    const shapes = [
        {c:'#a98be8',m:[[1,0,0],[1,1,1]]}, {c:'#f58ad0',m:[[0,1,1],[1,1,0]]},
        {c:'#6db3f2',m:[[1,1],[1,1]]},      {c:'#f7cf5a',m:[[1,1,1,1]]},
        {c:'#7bcf7f',m:[[1,1,0],[0,1,1]]}
    ];
    shapes.forEach(s=>{
        const p=document.createElement('div');p.className='piece';
        p.style.gridTemplateColumns=`repeat(${s.m[0].length},15px)`;
        s.m.flat().forEach(v=>{const i=document.createElement('i');if(v)i.style.background=s.c;else i.style.visibility='hidden';p.appendChild(i)});
        $('deco').appendChild(p);
    });

    // --- helpers
    let toastT;
    function toast(t,err){const e=$('toast');e.textContent=t;e.className='toast show'+(err?' err':'');clearTimeout(toastT);toastT=setTimeout(()=>e.className='toast',3200)}
    const fmt = d => { const x=new Date(d); return isNaN(x)?'':x.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) };

    function render(msgs, typing){
        log.innerHTML='';
        if(!msgs.length && !typing){
            log.innerHTML='<div class="empty"><b>No questions yet</b><br>Add a PDF on the left, then ask what you want to know about it.</div>';
        }
        msgs.forEach(m=>{
            const d=document.createElement('div');d.className='msg '+m.type;
            d.textContent=m.content;
            const t=document.createElement('time');t.textContent=fmt(m.dateTime);d.appendChild(t);
            log.appendChild(d);
        });
        if(typing){const d=document.createElement('div');d.className='msg SYSTEM typing';d.innerHTML='<span></span><span></span><span></span>';log.appendChild(d)}
        log.scrollTop=log.scrollHeight;
        const asked=msgs.filter(m=>m.type==='USER').length;
        $('score').textContent=String(asked*100).padStart(6,'0');
        const prevLevel=+$('level').textContent, lvl=1+Math.floor(asked/5);
        $('level').textContent=lvl;
        $('xp').style.width=((asked%5)/5*100)+'%';
        if(lvl>prevLevel) toast('Level up!');
    }

    let messages=[];
    async function load(){
        try{
            const r=await fetch(API+'/chat/messages');
            messages=(await r.json()).messages||[];
            render(messages);
        }catch{render([]);toast('Can’t reach the server. Is it running on port 8888?',true)}
    }

    // --- chat
    $('form').addEventListener('submit',async e=>{
        e.preventDefault();
        const content=q.value.trim(); if(!content) return;
        q.value='';send.disabled=true;
        render([...messages,{content,type:'USER',dateTime:new Date().toISOString()}],true);
        try{
            const r=await fetch(API+'/chat/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content})});
            if(!r.ok) throw 0;
            messages=(await r.json()).messages||[];
            render(messages);
        }catch{
            render(messages);toast('Message failed. Check the server and try again.',true);
        }
        send.disabled=false;q.focus();
    });

    // --- upload
    async function upload(file){
        if(!file) return;
        if(file.type!=='application/pdf'){return toast('Only PDF files work.',true)}
        if(file.size>5*1024*1024){return toast('File is over 5 MB.',true)}
        const fd=new FormData();fd.append('file',file);
        $('bar').classList.add('busy');
        try{
            const r=await fetch(API+'/upload',{method:'POST',body:fd});
            if(!r.ok) throw 0;
            const li=document.createElement('li');li.textContent=file.name;li.title=file.name;$('docs').appendChild(li);
            toast('Mission complete! PDF added.');
        }catch{toast('Upload failed. Try again.',true)}
        $('bar').classList.remove('busy');$('file').value='';
    }
    $('file').addEventListener('change',e=>upload(e.target.files[0]));
    const drop=$('drop');
    ['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('over')}));
    ['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('over')}));
    drop.addEventListener('drop',e=>upload(e.dataTransfer.files[0]));

    load();
</script>
</body>
</html>
